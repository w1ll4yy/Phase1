<!DOCTYPE html>

<html>
    <head>
        <title>User_Pass Project</title>
    </head>
    <body style="font-size:25px; background-color:mediumpurple;" >
        <form action="index.php" method="POST" enctype="multipart/form-date">
                    <label for="username">Username:</label>
        <input type="text" id="username" placeholder="W1ll4yy" minlength="8"><br>

        <label for="password">Password:</label>
        <input type="password" id="password" minlength="8" placeholder="********"><br>

        <label for="email">Email:</label>
        <input type="text" id="Email" placeholder="bruh@gmail.com"><br>

        <label for="phone">Phone#: </label>
        <input type="tel" id="phone" placeholder="012-345-6789" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>

        <label for="date">BirthDate: </label>
        <input type="date"><br>

        <label for="quanity">Quantity: </label>
        <input type="number" id="quanityt" min="0" max="99" value="1"><br>

        <label for="title">Title: </label>
        
        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr" value="Mr." name="title">
        <label for="Ms.">Mr.</label>
        <input type="radio" id="Ms" value="Ms." name="title">
        <label for="Phd">Mr.</label>
        <input type="radio" id="Phd" value="PhD." name="title"><br>

        <label for="payment">Payment: </label>

        <select id="payment">
            <option value="VISA">VISA</option>
            <option value="MasterCard">MasterCard</option>
            <option value="GiftCards">GiftCards</option>
        </select><br>

        <label for="subscribe">Subscribe: </label>
        <input type="checkbox" id="subscribe"><br>

        <label for="comment">Comments: </label>
        <textarea id="comment"></textarea>

        <br><br>
        <input type="reset">
        <input type="submit">
        </form>
    </body>
</html>
